version: 2
updates:
  - package-ecosystem: npm
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies"]

  - package-ecosystem: docker
    cooldown:
      default-days: 7
    directory: "/db"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "database"]

  - package-ecosystem: pip
    cooldown:
      default-days: 7
    directory: "/.github/requirements"
    schedule:
      interval: weekly
      day: monday
    groups:
      semgrep:
        patterns: ["*"]
    labels: ["dependencies", "ci"]

  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]
