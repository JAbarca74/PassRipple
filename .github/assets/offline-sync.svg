<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="t d">
  <title id="t">Offline-first gate validation</title>
  <desc id="d">With no signal, a gate device keeps scanning tickets and stores each operation in an encrypted local outbox. When the signal returns, every operation syncs to the API and none is lost.</desc>
  <defs>
    <g id="op">
      <rect width="40" height="50" rx="7" fill="#5B1FE0"/>
      <path d="M12 25l6 6 11-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-size:22px;font-weight:700;fill:#fff}
    .hs{font-size:15px;font-weight:500;fill:#B3A6E0}
    .lb{font-size:15px;font-weight:600;fill:#B3A6E0;text-anchor:middle}
    .st{font-size:14px;font-weight:700;letter-spacing:.06em;text-anchor:middle}
    .b{transform-box:fill-box;transform-origin:center}
    .b0{animation:b0 8s infinite}.b1{animation:b1 8s infinite}.b2{animation:b2 8s infinite}.b3{animation:b3 8s infinite}
    .scan{animation:scan 8s infinite}
    .off{animation:off 8s step-end infinite}.on{animation:on 8s step-end infinite}
    .s1{animation:s1 8s infinite}.s2{animation:s2 8s infinite}.s3{animation:s3 8s infinite}
    .flow{stroke-dasharray:8 10;animation:dash .6s linear infinite,s2 8s infinite}
    .ok{animation:s3 8s infinite}
    @keyframes b0{0%,5.5%{opacity:0;transform:translateY(10px)}7.5%,57.5%{opacity:1;transform:none}66%,100%{opacity:0;transform:translateX(652px) scale(.4)}}
    @keyframes b1{0%,18%{opacity:0;transform:translateY(10px)}20%,61.9%{opacity:1;transform:none}70.6%,100%{opacity:0;transform:translateX(600px) scale(.4)}}
    @keyframes b2{0%,30.5%{opacity:0;transform:translateY(10px)}32.5%,66.2%{opacity:1;transform:none}75%,100%{opacity:0;transform:translateX(548px) scale(.4)}}
    @keyframes b3{0%,43%{opacity:0;transform:translateY(10px)}45%,70.6%{opacity:1;transform:none}79.4%,100%{opacity:0;transform:translateX(496px) scale(.4)}}
    @keyframes scan{0%,5%{opacity:0}6.25%{opacity:.85}10%,17.5%{opacity:0}18.75%{opacity:.85}22.5%,30%{opacity:0}31.25%{opacity:.85}35%,42.5%{opacity:0}43.75%{opacity:.85}47.5%,100%{opacity:0}}
    @keyframes off{0%{opacity:1}55%{opacity:0}100%{opacity:1}}
    @keyframes on{0%{opacity:0}55%{opacity:1}100%{opacity:0}}
    @keyframes s1{0%,52%{opacity:1}55%,97%{opacity:0}100%{opacity:1}}
    @keyframes s2{0%,54%{opacity:0}57%,78%{opacity:1}81%,100%{opacity:0}}
    @keyframes s3{0%,80%{opacity:0}83%,96%{opacity:1}99%,100%{opacity:0}}
    @keyframes dash{to{stroke-dashoffset:-18}}
    /* biome-ignore lint/complexity/noImportantStyles: reduced motion must override every animation */
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.on,.s2,.s3,.ok,.flow,.scan{opacity:0}}
  </style>

  <rect x="1" y="1" width="1198" height="328" rx="24" fill="#0F0828" stroke="#2A1A66" stroke-width="2"/>
  <text class="h" x="40" y="50">Offline-first gates</text>
  <text class="hs" x="232" y="50">no signal all night, no operation lost (invariant I6)</text>

  <!-- Gate device -->
  <rect x="110" y="84" width="110" height="178" rx="18" fill="#1C1050" stroke="#fff" stroke-width="3"/>
  <rect x="150" y="93" width="30" height="5" rx="2.5" fill="#fff" opacity=".5"/>
  <rect x="133" y="125" width="64" height="64" rx="8" fill="none" stroke="#B3A6E0" stroke-width="3" stroke-dasharray="14 22" stroke-dashoffset="7"/>
  <rect class="scan" x="133" y="125" width="64" height="64" rx="8" fill="#00E5D8"/>
  <rect x="133" y="210" width="64" height="26" rx="13" fill="#24145F"/>
  <text x="165" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#EDE8FF">SCAN</text>
  <circle cx="226" cy="88" r="20" fill="#0F0828" stroke="#3A2A85" stroke-width="2"/>
  <g fill="none" stroke-width="2.5" stroke-linecap="round">
    <g class="off" stroke="#8C80B8">
      <path d="M215 87a15 15 0 0 1 22 0M219.5 92a8.5 8.5 0 0 1 13 0"/>
      <path d="M215 78L237 100" stroke="#FF6B8A"/>
    </g>
    <path class="on" stroke="#00E5D8" d="M215 87a15 15 0 0 1 22 0M219.5 92a8.5 8.5 0 0 1 13 0"/>
  </g>
  <circle cx="226" cy="97" r="2" fill="#B3A6E0"/>
  <text class="lb" x="165" y="296">Gate device</text>

  <!-- Encrypted local outbox -->
  <rect x="320" y="118" width="240" height="90" rx="14" fill="#170C3F" stroke="#2E1D74" stroke-width="2"/>
  <g fill="none" stroke="#9C8FCC" stroke-width="2" stroke-linecap="round">
    <rect x="433" y="222" width="14" height="11" rx="2"/>
    <path d="M436 222v-4a4 4 0 0 1 8 0v4"/>
  </g>
  <use class="b b0" href="#op" x="338" y="138"/>
  <use class="b b1" href="#op" x="390" y="138"/>
  <use class="b b2" href="#op" x="442" y="138"/>
  <use class="b b3" href="#op" x="494" y="138"/>
  <text class="lb" x="440" y="296">Encrypted local outbox</text>

  <!-- Link and status -->
  <line x1="584" y1="163" x2="930" y2="163" stroke="#2E1D74" stroke-width="3" stroke-linecap="round"/>
  <line class="flow" x1="584" y1="163" x2="930" y2="163" stroke="#00E5D8" stroke-width="3" stroke-linecap="round"/>
  <text class="st s1" x="757" y="205" fill="#FF8FA6">OFFLINE · SCANS KEEP WORKING</text>
  <text class="st s2" x="757" y="205" fill="#00E5D8">SIGNAL BACK · SYNCING</text>
  <text class="st s3" x="757" y="205" fill="#00E5D8">4 OF 4 SYNCED · 0 LOST</text>

  <!-- API -->
  <path d="M965 200H1065A32 32 0 0 0 1062 136A45 45 0 0 0 978 128A36 36 0 0 0 965 200Z" fill="#170C3F" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <path class="ok" d="M996 168l12 12 24-26" fill="none" stroke="#00E5D8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="lb" x="1015" y="296">API · PostgreSQL</text>
</svg>
