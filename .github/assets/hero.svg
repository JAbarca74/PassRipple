<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">PassRipple</title>
  <desc id="d">The PassRipple wordmark draws itself next to a QR ticket that is re-signed on a countdown, with ripples spreading from it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140640"/>
      <stop offset=".55" stop-color="#2E0E8C"/>
      <stop offset="1" stop-color="#5B1FE0"/>
    </linearGradient>
    <radialGradient id="glow" cx="1000" cy="190" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E5D8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#00E5D8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="146" y1="0" x2="286" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".12" stop-color="#fff"/>
      <stop offset=".88" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="wave-mask" maskUnits="userSpaceOnUse" x="140" y="80" width="152" height="50">
      <rect x="146" y="80" width="140" height="50" fill="url(#fade)"/>
    </mask>
    <clipPath id="card"><rect width="1200" height="400" rx="28"/></clipPath>
  </defs>
  <style>
    .w{fill:none;stroke:#fff;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;animation:draw 1.1s cubic-bezier(.6,0,.2,1) both}
    .w1{animation-delay:.05s}.w2{animation-delay:.15s}.w3{animation-delay:.25s}.w4{animation-delay:.35s}.w5{animation-delay:.5s}
    .w6{animation-delay:.6s}.w7{animation-delay:.7s}.w8{animation-delay:.8s}.w9{animation-delay:.9s}.w10{animation-delay:1s}
    .dot{animation:pop .4s 1.2s both}
    .wave{fill:none;stroke:#00E5D8;stroke-width:10;stroke-linecap:round;animation:flow 2.4s linear infinite}
    .wave-in{animation:fadein .8s 1.3s both}
    .tag{font:700 30px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#fff;animation:rise .8s 1.4s both}
    .sub{font:500 18px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#D6CCFF;animation:rise .8s 1.6s both}
    .cap{font:600 15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#B9F7F2;letter-spacing:.04em}
    .ring{fill:none;stroke:#00E5D8;stroke-width:5;stroke-linecap:round;stroke-dasharray:1;animation:count 4s linear infinite}
    .qa{animation:qa 8s step-end infinite}.qb{animation:qb 8s step-end infinite}
    @keyframes draw{0%{stroke-dashoffset:1;opacity:0}8%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
    @keyframes pop{from{opacity:0}to{opacity:1}}
    @keyframes fadein{from{opacity:0}to{opacity:1}}
    @keyframes flow{from{transform:translateX(0)}to{transform:translateX(-60px)}}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes count{from{stroke-dashoffset:0}to{stroke-dashoffset:1}}
    @keyframes qa{0%{opacity:1}50%{opacity:0}100%{opacity:0}}
    @keyframes qb{0%{opacity:0}50%{opacity:1}100%{opacity:1}}
    /* biome-ignore lint/complexity/noImportantStyles: reduced motion must override every animation */
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>
  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="url(#glow)"/>
    <g fill="none" stroke="#00E5D8" stroke-width="2">
      <circle cx="1000" cy="190" r="100" opacity="0">
        <animate attributeName="r" values="100;175" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".6;0" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1000" cy="190" r="100" opacity="0">
        <animate attributeName="r" values="100;175" dur="3s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".6;0" dur="3s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1000" cy="190" r="100" opacity="0">
        <animate attributeName="r" values="100;175" dur="3s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".6;0" dur="3s" begin="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Wordmark: the same stroke paths as brand/passripple-logo-dark.svg -->
  <g transform="translate(86 118) scale(1.1)">
    <path class="w w1" pathLength="1" d="M0 60V-10H12A20 20 0 0 1 12 30H0"/>
    <path class="w w2" pathLength="1" d="M89 20V60M49 40a20 20 0 1 0 40 0a20 20 0 1 0-40 0"/>
    <path class="w w3" pathLength="1" d="M129.8 25.8A13 10 0 1 0 118 40A13 10 0 1 1 106.2 54.2"/>
    <path class="w w4" pathLength="1" d="M171.8 25.8A13 10 0 1 0 160 40A13 10 0 1 1 148.2 54.2"/>
    <path class="w w5" pathLength="1" d="M189 60V-10H201A20 20 0 0 1 201 30H189M203 30L223 60"/>
    <path class="w w6" pathLength="1" d="M241 20V60"/>
    <circle class="dot" cx="241" cy="0" r="5" fill="#fff"/>
    <path class="w w7" pathLength="1" d="M261 20V80M261 40a20 20 0 1 0 40 0a20 20 0 1 0-40 0"/>
    <path class="w w8" pathLength="1" d="M318 20V80M318 40a20 20 0 1 0 40 0a20 20 0 1 0-40 0"/>
    <path class="w w9" pathLength="1" d="M375 -10V60"/>
    <path class="w w10" pathLength="1" d="M392 40H432A20 20 0 1 0 428.4 51.5"/>
    <g class="wave-in" mask="url(#wave-mask)">
      <path class="wave" d="M96 104q15-14 30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0"/>
    </g>
  </g>

  <text class="tag" x="86" y="318">Fraud-proof event ticketing for Costa Rica</text>
  <text class="sub" x="86" y="354">Device-bound QR tickets · Offline-first gates · SINPE Móvil payments</text>

  <!-- QR ticket re-signed when the countdown ring runs out -->
  <circle class="ring" cx="1000" cy="190" r="100" pathLength="1" transform="rotate(-90 1000 190)"/>
  <rect x="920" y="110" width="160" height="160" rx="20" fill="#fff"/>
  <g fill="#5B1FE0">
    <rect x="937" y="127" width="54" height="54" rx="6"/>
    <rect x="1009" y="127" width="54" height="54" rx="6"/>
    <rect x="937" y="199" width="54" height="54" rx="6"/>
  </g>
  <g fill="#fff">
    <rect x="946" y="136" width="36" height="36" rx="3"/>
    <rect x="1018" y="136" width="36" height="36" rx="3"/>
    <rect x="946" y="208" width="36" height="36" rx="3"/>
  </g>
  <g fill="#5B1FE0">
    <rect x="955" y="145" width="18" height="18" rx="2"/>
    <rect x="1027" y="145" width="18" height="18" rx="2"/>
    <rect x="955" y="217" width="18" height="18" rx="2"/>
  </g>
  <g fill="#1B0A52">
    <g class="qa">
      <rect x="993" y="129" width="14" height="14" rx="2"/>
      <rect x="993" y="165" width="14" height="14" rx="2"/>
      <rect x="939" y="183" width="14" height="14" rx="2"/>
      <rect x="975" y="183" width="14" height="14" rx="2"/>
      <rect x="1011" y="183" width="14" height="14" rx="2"/>
      <rect x="1047" y="183" width="14" height="14" rx="2"/>
      <rect x="1011" y="201" width="14" height="14" rx="2"/>
      <rect x="1047" y="219" width="14" height="14" rx="2"/>
      <rect x="1029" y="237" width="14" height="14" rx="2"/>
      <rect x="993" y="219" width="14" height="14" rx="2"/>
    </g>
    <g class="qb">
      <rect x="993" y="147" width="14" height="14" rx="2"/>
      <rect x="957" y="183" width="14" height="14" rx="2"/>
      <rect x="993" y="183" width="14" height="14" rx="2"/>
      <rect x="1029" y="183" width="14" height="14" rx="2"/>
      <rect x="1029" y="201" width="14" height="14" rx="2"/>
      <rect x="1011" y="237" width="14" height="14" rx="2"/>
      <rect x="1047" y="237" width="14" height="14" rx="2"/>
      <rect x="993" y="237" width="14" height="14" rx="2"/>
      <rect x="1011" y="219" width="14" height="14" rx="2"/>
    </g>
  </g>
  <text class="cap" x="1000" y="330" text-anchor="middle">RE-SIGNED EVERY 30 S</text>
</svg>
