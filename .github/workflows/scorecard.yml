name: scorecard

# OpenSSF Scorecard: grades the repository's supply-chain practices (pinned actions,
# branch protection, token permissions, signed releases) and publishes the badge in README.md.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 10 * * 1" # every Monday
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # upload the results to code scanning
      id-token: write # publish the results to the public Scorecard API (badge)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Fine-grained PAT with Administration: read-only on this repository, so the
          # Branch-Protection check can read the classic rules. Falls back to the workflow token.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
