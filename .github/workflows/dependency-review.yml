name: dependency-review

# Blocks a pull request that adds a dependency with a known high or critical vulnerability,
# and shows the OpenSSF Scorecard of every new dependency so a weak or abandoned one stands out.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Same exception as auditConfig in pnpm-workspace.yaml: the fix of
          # decode-uri-component is ESM-only and query-string (under expo-router) requires the
          # CommonJS 0.2 line; the scanner only parses its own deep links.
          allow-ghsas: GHSA-qr28-fpjm-wq7f
          show-openssf-scorecard: true
          warn-on-openssf-scorecard-level: 3
