  <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Esta página no existe en PassRipple." />

  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="../../brand/passripple-icon.svg" />

  <!-- Applies the saved theme before the first paint: a classic script, so it blocks. -->

</head>

      <!-- Moon: shown in light mode -->

        <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/>
      </svg>
      <!-- Sun: shown in dark mode -->
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4.5"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>

    </button>

  <!-- Not found: the same hero as the holding page, with the code as the animated word -->

      <path class="ticket-outline" d="M12 4H148a8 8 0 0 1 8 8V34a10 10 0 0 0 0 20V84a8 8 0 0 1-8 8H12a8 8 0 0 1-8-8V54a10 10 0 0 0 0-20V12a8 8 0 0 1 8-8Z" />

      <rect class="ticket-cell" x="29" y="21" width="9" height="9" rx="1.5" />
      <rect class="ticket-cell" x="40" y="21" width="9" height="9" rx="1.5" />
      <rect class="ticket-cell" x="62" y="21" width="9" height="9" rx="1.5" />
      <rect class="ticket-cell" x="73" y="21" width="9" height="9" rx="1.5" />

      <rect class="ticket-cell" x="29" y="54" width="9" height="9" rx="1.5" />
      <rect class="ticket-cell" x="51" y="54" width="9" height="9" rx="1.5" />
      <rect class="ticket-cell" x="62" y="54" width="9" height="9" rx="1.5" />
      <rect class="ticket-cell cell-lost cell-lost-c" x="73" y="54" width="9" height="9" rx="1.5" />
      <rect class="ticket-cell" x="29" y="65" width="9" height="9" rx="1.5" />

      <rect class="ticket-cell" x="73" y="65" width="9" height="9" rx="1.5" />

      <path class="ticket-scan" d="M16 14H100" />
    </svg>

    <!-- Split into letters by src/coming-soon/reveal-word.ts; without it the code shows whole. -->
    <p class="hero-word hero-code" data-reveal-word>404</p>
    <p class="hero-label">Página no encontrada</p>

    <h1>Esta página no existe</h1>

    <svg class="hero-wave" aria-hidden="true" viewBox="0 0 140 20">
      <path d="M10 10q15-10 30 0t30 0t30 0t30 0" />
    </svg>

    <p class="hero-sub">
      Puede que el enlace esté mal escrito o que la página ya no exista.
      Mientras tanto, conozca lo que estamos construyendo.
    </p>

    <a class="home-button" href="/">Volver al inicio</a>
  </main>
