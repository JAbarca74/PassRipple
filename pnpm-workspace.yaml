packages:
  - "packages/*"
  - "modules/*"
  - "apps/*"
  - "workers/*"

# Supply-chain protection: never install a version published less than 7 days ago,
# never accept a version with weaker trust evidence than earlier ones, and never
# let a transitive dependency come from outside the registry.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true
# Exceptions to the trust policy, each one checked by hand. semver@6.3.1 (2023, used by
# Babel through Expo) predates npm provenance, so it looks weaker than semver 7.
trustPolicyExclude:
  - semver@6.3.1

# Dependencies allowed to run install scripts: esbuild and workerd fetch their platform
# binaries for wrangler. Every other install script stays blocked.
onlyBuiltDependencies:
  - esbuild
  - workerd

# Security fixes for build-time tools. Every one lives in a dev or build tool (wrangler's
# miniflare, React Native's devtools), never in the Worker bundle or the app binary.
overrides:
  undici@>=7.0.0 <7.29.1: "^7.29.1"
  sharp@<0.35.5: ">=0.35.5"
  shell-quote@>=1.8.4 <1.11.0: ">=1.11.0"

# No patched version exists yet for these two. Both are reachable only through the Expo CLI
# on a developer machine or in CI (node-forge for its dev HTTPS certificates, braces for
# file globbing during bundling); neither is in the app. Revisit when a patch is published.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
