packages:
  - "packages/*"
  - "modules/*"
  - "apps/*"
  - "workers/*"

# Supply-chain protection: never install a version published less than 7 days ago,
# never accept a version with weaker trust evidence than earlier ones, and never
# let a transitive dependency come from outside the registry.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true
# Exceptions to the trust policy, each one checked by hand. semver@6.3.1 (2023, used by
# Babel through Expo) predates npm provenance, so it looks weaker than semver 7.
trustPolicyExclude:
  - semver@6.3.1
