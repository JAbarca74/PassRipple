rules:
  - id: passripple-no-math-random
    message: >-
      Math.random() is not cryptographically secure. Use crypto.getRandomValues()
      for codes, tokens, identifiers and anything security-related.
    severity: ERROR
    languages: [typescript, javascript]
    paths:
      # Test code never ships, so it may use Math.random() (for example, to shuffle inputs).
      exclude:
        - "*.test.ts"
    pattern: Math.random()

  - id: passripple-pure-packages-no-io
    message: >-
      Pure packages must not perform I/O, read the clock or the environment, draw
      randomness or use platform keys (architecture rule R4). Receive the time, the
      random bytes, a signer or the data as a parameter instead.
    severity: ERROR
    languages: [typescript, javascript]
    paths:
      include:
        - "/packages/contracts/"
        - "/packages/crypto/"
        - "/packages/pricing/"
        - "/packages/tax/"
        - "/packages/bank-parsers/"
      # Tests are not the package: they may use WebCrypto to check signature compatibility.
      exclude:
        - "*.test.ts"
    pattern-either:
      - pattern: fetch(...)
      - pattern: Date.now()
      - pattern: new Date()
      - pattern: performance.now()
      - pattern: process.env.$X
      - pattern: crypto.getRandomValues(...)
      - pattern: crypto.randomUUID()
      - pattern: crypto.subtle.$F(...)

  - id: passripple-no-sql-string-building
    message: >-
      Do not build SQL with string concatenation or interpolation.
      Use parameterized queries.
    severity: ERROR
    languages: [typescript, javascript]
    pattern-either:
      - pattern: $DB.query("..." + $X, ...)
      - pattern: $DB.query(`...${$X}...`, ...)
      - pattern: $DB.unsafe(...)

  - id: passripple-no-dangerous-html
    message: >-
      dangerouslySetInnerHTML opens the door to XSS, which in the wallet means
      a script that can use the buyer's ticket keys (invariant I8).
    severity: ERROR
    languages: [typescript, javascript]
    pattern: <$EL dangerouslySetInnerHTML={...} />

  - id: passripple-no-eval
    message: eval and new Function execute arbitrary code.
    severity: ERROR
    languages: [typescript, javascript]
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
