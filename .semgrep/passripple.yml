rules:
  - id: passripple-no-math-random
    message: >-
      Math.random() is not cryptographically secure. Use crypto.getRandomValues()
      for codes, tokens, identifiers and anything security-related.
    severity: ERROR
    languages: [typescript, javascript]
    pattern: Math.random()

  - id: passripple-pure-packages-no-io
    message: >-
      Pure packages must not perform I/O or read the clock (architecture rule R4).
      Receive the time or the data as a parameter instead.
    severity: ERROR
    languages: [typescript, javascript]
    paths:
      include:
        - "packages/crypto/"
        - "packages/pricing/"
        - "packages/tax/"
        - "packages/bank-parsers/"
    pattern-either:
      - pattern: fetch(...)
      - pattern: Date.now()
      - pattern: new Date()
      - pattern: process.env.$X

  - id: passripple-no-sql-string-building
    message: >-
      Do not build SQL with string concatenation or interpolation.
      Use parameterized queries.
    severity: ERROR
    languages: [typescript, javascript]
    pattern-either:
      - pattern: $DB.query("..." + $X, ...)
      - pattern: $DB.query(`...${$X}...`, ...)
      - pattern: $DB.unsafe(...)

  - id: passripple-no-dangerous-html
    message: >-
      dangerouslySetInnerHTML opens the door to XSS, which in the wallet means
      a script that can use the buyer's ticket keys (invariant I8).
    severity: ERROR
    languages: [typescript, javascript]
    pattern: <$EL dangerouslySetInnerHTML={...} />

  - id: passripple-no-eval
    message: eval and new Function execute arbitrary code.
    severity: ERROR
    languages: [typescript, javascript]
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
