# Local database for development and tests only.
# Bound to 127.0.0.1 and using trust authentication, so it must never be exposed.
services:
  db:
    build: .
    environment:
      POSTGRES_USER: passwave
      POSTGRES_DB: passwave
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passwave -d passwave"]
      interval: 2s
      timeout: 3s
      retries: 30
